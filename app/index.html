<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Coast Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover editor controls">
    <header class="brand">
      <p class="brand-kicker">Vice Coast</p>
      <h1>Cover Studio</h1>
      <p class="brand-sub">Your photos + a caption, made into GTA-style cover art. Offline, no uploads.</p>
    </header>

    <section class="group" aria-label="Photos">
      <h2>1 · Photos</h2>
      <p class="hint">Up to 4 photos. Click a thumbnail to use it, or drop in your own.</p>
      <div id="thumbs" class="thumbs"></div>
      <label class="file-btn">Add your photos
        <input id="photoInput" type="file" accept="image/*" multiple>
      </label>
    </section>

    <section class="group" aria-label="Layout">
      <h2>2 · Layout</h2>
      <div id="layouts" class="choice-grid"></div>
    </section>

    <section class="group" aria-label="Colour grade">
      <h2>3 · Grade</h2>
      <div id="grades" class="choice-grid"></div>
    </section>

    <section class="group" aria-label="Words">
      <h2>4 · Words</h2>
      <label>Title
        <input id="title" type="text" maxlength="24" value="VICE COAST" autocomplete="off">
      </label>
      <label>Subtitle
        <input id="subtitle" type="text" maxlength="48" value="Neon nights, palm dreams" autocomplete="off">
      </label>
      <label>Badge
        <input id="badge" type="text" maxlength="24" value="VICE COAST" autocomplete="off">
      </label>
      <label>Heat
        <span class="heat-row">
          <input id="heat" type="range" min="0" max="5" step="1" value="4">
          <span id="heatStars" class="heat-stars" aria-live="polite">★★★★☆</span>
        </span>
      </label>
    </section>

    <section class="group" aria-label="Panel">
      <h2>5 · This panel</h2>
      <label>Panel
        <select id="panelSelect"></select>
      </label>
      <label>Photo in this panel
        <select id="panelPhoto"></select>
      </label>
      <label>Pan left–right
        <input id="panX" type="range" min="-50" max="50" step="1" value="0">
      </label>
      <label>Pan up–down
        <input id="panY" type="range" min="-50" max="50" step="1" value="0">
      </label>
      <label>Zoom
        <input id="zoom" type="range" min="100" max="250" step="5" value="100">
      </label>
    </section>

    <section class="group" aria-label="Export">
      <h2>6 · Export</h2>
      <label>Size
        <select id="size">
          <option value="1080x1080" selected>1080 × 1080 · square</option>
          <option value="1080x1350">1080 × 1350 · portrait</option>
          <option value="1920x1080">1920 × 1080 · wide</option>
          <option value="1080x1920">1080 × 1920 · story</option>
        </select>
      </label>
      <div class="btn-row">
        <button id="undo" type="button" disabled>Undo</button>
        <button id="redo" type="button" disabled>Redo</button>
      </div>
      <button id="export" class="export-btn" type="button">Export PNG</button>
      <p id="status" role="status"></p>
    </section>
  </section>

  <section class="stage" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
